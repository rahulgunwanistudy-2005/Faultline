<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Faultline reconstructs the procedure behind a student's fraction errors." />
  <title>Faultline — See the procedure behind the error</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .static-icon{display:inline-grid;place-items:center;font-size:16px;line-height:1}.static-icon svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.is-hidden{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:#171715;color:#fffdf8;border-radius:10px;padding:11px 15px;font-size:11px;box-shadow:0 15px 45px rgba(0,0,0,.25);animation:modalIn .25s ease}.fit.match,.fit.miss{justify-self:start}.error-note{color:#9b442f;font-size:10px;margin-top:8px}.reading-review-strip{display:flex;align-items:center;gap:9px;border-radius:10px;padding:10px 12px;background:#f4e9ca;color:#755114;font-size:10px;margin-top:12px}.reading-review-strip button{margin-left:auto;border:0;background:transparent;text-decoration:underline;cursor:pointer;color:inherit}.proof-card button:disabled{opacity:.5;cursor:not-allowed}
  </style>
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite"></div>
  <noscript>Faultline requires JavaScript for the interactive demo.</noscript>
  <script src="assets/demo-class.js"></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
